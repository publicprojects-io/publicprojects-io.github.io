<!doctype html>
<!--
  Source of static/social-card.png, the Open Graph image for every page and locale.
  Language-neutral on purpose: only the site name, domain, logo, and hero art, so one
  image serves all locales. Colours are Lily's default light theme.
  Regenerate: open this file in a browser at 1200 x 630 and take a screenshot, e.g.
  pnpm dlx playwright screenshot --viewport-size=1200,630 scripts/social-card.html static/social-card.png
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Public Projects social card</title>
<style>
	:root {
		--color-base-100: oklch(100% 0 0);
		--color-base-200: oklch(98% 0 0);
		--color-base-content: oklch(21% 0.006 285.885);
		--color-primary: oklch(45% 0.24 277.023);
	}
	html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
	body {
		display: grid;
		grid-template-columns: 1fr 420px;
		align-items: center;
		gap: 40px;
		box-sizing: border-box;
		padding: 0 96px;
		background: var(--color-base-100);
		color: var(--color-base-content);
		font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
		border-bottom: 24px solid var(--color-primary);
	}
	.brand { display: flex; align-items: center; gap: 28px; color: var(--color-primary); }
	.brand svg { width: 112px; height: 112px; flex: none; }
	h1 { margin: 0; font-size: 88px; line-height: 1.02; letter-spacing: -0.02em; color: var(--color-base-content); }
	.domain { margin: 40px 0 0; font-size: 40px; font-weight: 600; color: var(--color-primary); }
	.art { width: 420px; height: 420px; color: var(--color-base-content); }
	.art .nodes circle { fill: currentColor; }
	.art .cross { fill: var(--color-base-100); }
</style>
</head>
<body>
	<div>
		<div class="brand">
			<svg viewBox="0 0 32 32" aria-hidden="true">
				<circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2.5" />
				<path d="M13 8h6v5h5v6h-5v5h-6v-5H8v-6h5z" fill="currentColor" />
			</svg>
			<h1>Public Projects</h1>
		</div>
		<p class="domain">publicprojects.io</p>
	</div>
	<svg class="art" viewBox="0 0 320 320" aria-hidden="true">
		<circle cx="160" cy="160" r="128" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="2" />
		<ellipse cx="160" cy="160" rx="56" ry="128" fill="none" stroke="currentColor" stroke-opacity="0.25" stroke-width="2" />
		<ellipse cx="160" cy="160" rx="128" ry="48" fill="none" stroke="currentColor" stroke-opacity="0.25" stroke-width="2" />
		<line x1="32" y1="160" x2="288" y2="160" stroke="currentColor" stroke-opacity="0.2" stroke-width="2" />
		<g stroke="var(--color-primary)" stroke-width="3" stroke-linecap="round">
			<line x1="92" y1="96" x2="160" y2="160" />
			<line x1="160" y1="160" x2="236" y2="112" />
			<line x1="160" y1="160" x2="214" y2="232" />
			<line x1="160" y1="160" x2="96" y2="220" />
			<line x1="92" y1="96" x2="236" y2="112" />
			<line x1="96" y1="220" x2="214" y2="232" />
		</g>
		<g class="nodes">
			<circle cx="160" cy="160" r="16" />
			<circle cx="92" cy="96" r="10" />
			<circle cx="236" cy="112" r="10" />
			<circle cx="214" cy="232" r="10" />
			<circle cx="96" cy="220" r="10" />
		</g>
		<path class="cross" d="M156 152h8v4h4v8h-4v4h-8v-4h-4v-8h4z" />
	</svg>
</body>
</html>
