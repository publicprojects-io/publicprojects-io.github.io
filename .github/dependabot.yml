version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      lily:
        patterns: ['@lilydesignsystem/*']
    ignore:
      # SvelteKit needs TypeScript's JavaScript compiler API, which TypeScript 7 removed.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
